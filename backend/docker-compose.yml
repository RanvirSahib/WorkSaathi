version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: worksaathi-postgres
    environment:
      POSTGRES_DB: worksaathi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - worksaathi-network

  redis:
    image: redis:7-alpine
    container_name: worksaathi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - worksaathi-network

  backend:
    build: .
    container_name: worksaathi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/worksaathi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-must-be-at-least-256-bits-long-for-security
    depends_on:
      - postgres
      - redis
    networks:
      - worksaathi-network

volumes:
  postgres_data:
  redis_data:

networks:
  worksaathi-network:
    driver: bridge
